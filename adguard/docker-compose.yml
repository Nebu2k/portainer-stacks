services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      # DNS Ports (REQUIRED - für alle Clients im LAN)
      - "53:53/tcp"
      - "53:53/udp"
      
      # Web UI (REQUIRED - für Admin-Zugriff)
      # Port 80 intern (nach Setup), 8080 extern
      - "8080:80/tcp"
      
      # Optional: DNS-over-TLS (für externe Clients/Mobile)
      # - "853:853/tcp"
      
      # Optional: DNS-over-HTTPS (für externe Clients)
      # - "443:443/tcp"
      # - "443:443/udp"
    
    volumes:
      - /data/adguard/workdir:/opt/adguardhome/work
      - /data/adguard/confdir:/opt/adguardhome/conf
    
    labels:
      homepage.group: Infrastructure
      homepage.name: AdGuard Home (Pi5)
      homepage.icon: adguard-home.png
      homepage.href: https://adguard-pi5.elmstreet79.de
      homepage.description: DNS Ad Blocker
      homepage.weight: 43
      homepage.widget.type: adguard
      homepage.widget.url: https://adguard-pi5.elmstreet79.de
      homepage.widget.username: ${ADGUARD_USERNAME}
      homepage.widget.password: ${ADGUARD_PASSWORD}
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/login.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
